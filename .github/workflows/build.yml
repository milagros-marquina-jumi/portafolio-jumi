name: Build

# Existe por una razon concreta. El PR que subio @vitejs/plugin-react a 6 paso
# entero el control de seguridad y dejo la rama sin poder instalarse: la 6
# exige vite ^8 y el proyecto tiene vite ^6. Ese control verifica que no haya
# malware, archivos prohibidos ni identidades sin autorizar; no compila nada.
# Un status check verde no dice que el proyecto funcione, y aqui es donde se
# dice.

on:
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Este nombre es el que referencia el ruleset como status check
    # obligatorio. Renombrarlo deja los pull requests esperando para siempre a
    # un check que ya no reporta.
    name: Compilar y revisar el codigo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # pnpm se activa con corepack y no con pnpm/action-setup: la politica de
      # la organizacion solo admite acciones de GitHub o de creadores
      # verificados, y con esa accion el workflow ni arranca.
      - name: Preparar pnpm
        run: corepack enable

      - name: Version de las herramientas
        run: node --version && pnpm --version

      # --ignore-scripts es deliberado y no lo reemplaza CI=true: un preinstall
      # o un postinstall de una dependencia comprometida se ejecutaria aqui con
      # acceso a la red. La compilacion se invoca despues, de forma explicita.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Compilar
        run: pnpm run build

      - name: Revisar el codigo
        run: pnpm run lint

      - name: Pruebas
        run: pnpm run test
