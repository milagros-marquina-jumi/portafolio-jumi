# Perfil: generic
# Politica base para cualquier repositorio que no tenga un perfil propio.
# Bloquea secretos, binarios, historial exportado, dependencias, artefactos de
# build y las firmas conocidas.
#
# LIMITACION ACEPTADA (ver ADR-0011): en un repositorio de codigo la deteccion
# por extension es necesariamente mas debil que en uno de notas. Bloquear .js
# es un lujo que solo permite un repositorio documental, asi que aqui el peso
# recae en el detector estructural, que es una heuristica y no una garantia.

MTS_LISTA_EJECUTABLES=".github/ejecutables-permitidos.txt"
MTS_LISTA_AUTORES=".github/autores-permitidos.txt"
MTS_SCANIGNORE=".scanignore"

# Un repositorio de codigo no puede prohibir fuentes. Se sigue aplicando el
# control del bit 100755, que si es significativo: un script sin extension (o
# con una inocente) igual se ejecuta.
MTS_BLOQUEAR_SCRIPTS=0

MTS_MAX_LINEA_CONFIG=500
MTS_RUTA_DETECTOR=".github/scan-malware.sh"
# Verificar la deriva de los archivos locales (hook y controles) contra el
# manifiesto del motor. Solo avisa; nunca bloquea.
MTS_VERIFICAR_LOCALES=1
