# Perfil: node
# Para repositorios de JavaScript o TypeScript. Parte de 'generic' y añade la
# higiene de dependencias, que es donde entro el malware del incidente
# 2026-09-01: codigo de terceros ejecutandose al instalar, sin que nadie lo lea.

MTS_LISTA_EJECUTABLES=".github/ejecutables-permitidos.txt"
MTS_LISTA_AUTORES=".github/autores-permitidos.txt"
MTS_SCANIGNORE=".scanignore"

# Un repositorio de codigo no puede prohibir fuentes. Se sigue aplicando el
# control del bit 100755, que si es significativo: un script sin extension (o
# con una inocente) igual se ejecuta.
MTS_BLOQUEAR_SCRIPTS=0

MTS_MAX_LINEA_CONFIG=500
MTS_RUTA_DETECTOR=".github/scan-malware.sh"
MTS_VERIFICAR_LOCALES=1

# Activa check-node.sh: un solo lockfile, y ningun script de instalacion sin
# declarar. Ver la LIMITACION de abajo antes de dar esto por suficiente.
MTS_NODE=1
MTS_LISTA_SCRIPTS_INSTALACION=".github/scripts-instalacion-permitidos.txt"

# LIMITACION ACEPTADA, y conviene tenerla presente:
#
# Este perfil comprueba el package.json DEL REPOSITORIO. No lee los de las
# dependencias, y no podria: son decenas de miles y cambian en cada
# instalacion. Lo que contiene a una dependencia comprometida es instalar con
# los scripts desactivados, y eso es cosa del workflow del consumidor:
#
#     npm ci --ignore-scripts      pnpm install --frozen-lockfile --ignore-scripts
#
# CI=true NO equivale a --ignore-scripts. Es una confusion frecuente: CI=true
# solo cambia el modo interactivo de algunas herramientas, y deja los ganchos
# de instalacion ejecutandose igual.
#
# Tampoco corre `npm audit` ni compila. Un aviso de vulnerabilidad aparece y
# desaparece por su cuenta varias veces al mes; si bloqueara el merge, el
# control se volveria ruido y acabaria desactivado. La auditoria va en un job
# aparte, junto con el build, porque son preguntas distintas: este control dice
# si el repositorio esta bien construido, no si sus dependencias tienen avisos
# abiertos hoy.
