version: 2
updates:
  # Las acciones estan ancladas por SHA completo, no por etiqueta. Un SHA no se
  # actualiza solo, asi que sin Dependabot el repositorio se queda clavado en la
  # version del dia que se anclo, incluida una con un fallo conocido.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: chore

  # npm. El historial se reinicio con 68 vulnerabilidades heredadas; lo que
  # evita que vuelvan a acumularse es que alguien avise cada semana, no una
  # limpieza puntual.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    # react y react-dom tienen que subir SIEMPRE juntas. Cuando Dependabot
    # subio react a 19.2.8 dejando react-dom en 19.1.0, la pagina murio entera
    # con el error 527 de React. Los tipos van en el mismo grupo por lo mismo.
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
