  <script>
    (function () {
      var segmentosBase = 1;
      var l = window.location;
      var ruta = l.pathname.split('/').slice(1 + segmentosBase).join('/');
      l.replace(
        l.protocol + '//' + l.host +
        l.pathname.split('/').slice(0, 1 + segmentosBase).join('/') + '/?/' +
        ruta.replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    })();
  </script>
